[package]
name = "gitmesh"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "One logical project over many physical Git repositories"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gitmesh/gitmesh"
readme = "README.md"

[lib]
name = "gitmesh"
path = "src/lib.rs"

[[bin]]
name = "gitmesh"
path = "src/main.rs"

[dependencies]
# CLI parsing. Derive-based, no runtime framework.
clap = { version = "4", features = ["derive", "wrap_help"] }
# Manifest (de)serialisation.
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# Error handling.
thiserror = "2"

# Terminal user interface (milestone 09). A renderer plus a terminal backend;
# no application framework and no async runtime.
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
